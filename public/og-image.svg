  </text>

  <!-- Badge -->
  <rect x="420" y="470" rx="20" ry="20" width="360" height="38" fill="#6366f1" opacity="0.15" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>
  <text x="600" y="495" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#a5b4fc" text-anchor="middle">
    Solo 4 cupos disponibles · Activación inmediata
  </text>

  <!-- URL -->
  <text x="600" y="570" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="500" fill="#64748b" text-anchor="middle">
    googleaifamily.ar
