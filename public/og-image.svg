<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow central -->
  <circle cx="600" cy="250" r="200" fill="#6366f1" opacity="0.12" filter="blur(80px)"/>

  <!-- Logo / Ícono -->
  <g transform="translate(560, 140)" fill="none" stroke="url(#text)" stroke-width="2.5">
    <circle cx="40" cy="40" r="38"/>
    <path d="M40 15c-13.8 0-25 11.2-25 25s11.2 25 25 25 25-11.2 25-25-11.2-25-25-25zm-2.5 44.8c-9.9-1.2-17.5-9.6-17.5-19.8 0-1.5.2-3 .5-4.5l12 7.5v2.5c0 2.7 2.2 5 5 5v4.8zm17.2-6.3c-.6-2-2.5-3.5-4.7-3.5h-2.5v-7.5c0-1.4-1.1-2.5-2.5-2.5h-7.5v-5h5c1.4 0 2.5-1.1 2.5-2.5V32h5c2.7 0 5-2.2 5-5v-1c7.3 3 12.5 10.2 12.5 18.5 0 5.2-2 9.9-5.2 13.5z" fill="url(#text)"/>
  </g>

  <!-- Título principal -->
  <text x="600" y="380" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-1">
    Google AI Pro + YouTube Premium
  </text>

  <!-- Subtítulo con gradiente -->
  <text x="600" y="430" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="url(#text)" text-anchor="middle">
